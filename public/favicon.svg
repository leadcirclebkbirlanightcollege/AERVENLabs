<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect width="128" height="128" rx="28" fill="#030712"/>
  <defs>
    <linearGradient id="silver-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="silver-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Apex Pillar -->
  <polygon points="64,22 52,48 40,88 28,102 46,102 58,74 64,54" fill="url(#silver-left)"/>
  
  <!-- Right Apex Pillar -->
  <polygon points="64,22 76,48 88,88 100,102 82,102 70,74 64,54" fill="url(#silver-right)"/>
  
  <!-- Glowing Azure Ribbon -->
  <path d="M38,78 C50,60 64,88 90,66 C82,78 68,68 50,86 Z" fill="url(#cyan-glow)" filter="url(#glow)"/>
</svg>
